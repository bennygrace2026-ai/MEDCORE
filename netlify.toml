[build]
  publish = "dist"
  command = "npm run build"
  environment = { SECRETS_SCAN_ENABLED = "false" }

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  ignored_node_modules = ["@libsql/client"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
