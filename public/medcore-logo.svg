<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Shield / Icon Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="40" y="40" width="432" height="432" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6"/>

  <!-- Subtle Medical Grid / Radial Texture -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.1" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.05"/>

  <!-- Bold Medical Cross -->
  <!-- Vertical Beam -->
  <rect x="216" y="116" width="80" height="280" rx="24" fill="url(#crossGrad)" filter="url(#shadow)"/>
  <!-- Horizontal Beam -->
  <rect x="116" y="216" width="280" height="80" rx="24" fill="url(#crossGrad)" filter="url(#shadow)"/>

  <!-- High-Precision ECG / Pulse Line Crossing the Emblem -->
  <path d="M 96 256 L 180 256 L 205 200 L 235 320 L 265 170 L 295 300 L 320 256 L 416 256" 
        fill="none" 
        stroke="#dc2626" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#shadow)"/>
        
  <!-- Glowing Pulse Nodes -->
  <circle cx="265" cy="170" r="8" fill="#fbbf24" />
  <circle cx="235" cy="320" r="6" fill="#fbbf24" opacity="0.8"/>

  <!-- Small Top Gold Star of Life Accent -->
  <path d="M 256 80 L 260 92 L 272 96 L 260 100 L 256 112 L 252 100 L 240 96 L 252 92 Z" fill="url(#goldGrad)"/>

  <!-- Subtle Bottom Caduceus Leaf Motif -->
  <path d="M 216 412 C 236 430, 276 430, 296 412 C 280 416, 232 416, 216 412 Z" fill="url(#goldGrad)" opacity="0.9"/>
</svg>